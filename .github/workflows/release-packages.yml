name: Release packages

on:
  workflow_dispatch:
    inputs:
      validation_target:
        description: "Environment to validate"
        type: choice
        default: all
        options:
          - all
          - darwin-arm64
          - darwin-x64
          - linux-arm64
          - linux-x64
          - windows-fallback
      resource_soak_seconds:
        description: "Production proxy resource soak (0 disables, maximum 3600 seconds)"
        type: string
        default: "0"

permissions:
  contents: read

# A release is built and tested on the native CPU for every advertised target.
# Publishing stays separate so only these exact, verified VSIX files are uploaded.
jobs:
  package:
    if: inputs.validation_target != 'windows-fallback'
    name: ${{ matrix.target }}
    runs-on: ${{ fromJSON('{"darwin-arm64":"macos-15","darwin-x64":"macos-15-intel","linux-arm64":"ubuntu-24.04-arm","linux-x64":"ubuntu-24.04"}')[matrix.target] }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        target: ${{ (!inputs.validation_target || inputs.validation_target == 'all') && fromJSON('["darwin-arm64","darwin-x64","linux-arm64","linux-x64"]') || fromJSON(format('["{0}"]', inputs.validation_target)) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Prepare native test prerequisites
        run: |
          mkdir -p .tmp/release-logs
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y lsof zsh xvfb
          else
            sudo ifconfig lo0 alias 127.93.164.7 up
            sudo ifconfig lo0 alias 127.93.164.8 up
          fi
      - run: npm ci
      - name: Build and verify native runtime
        run: npm run build:hook 2>&1 | tee .tmp/release-logs/native-build.log
        env:
          PORT_MANAGER_NATIVE_TARGET: ${{ matrix.target }}
      - name: Unit and native integration tests
        run: npm run test:ci 2>&1 | tee .tmp/release-logs/tests.log
        env:
          PM_RUN_NATIVE_E2E: "1"
      - name: Package target VSIX
        run: npm run package:${{ matrix.target }} 2>&1 | tee .tmp/release-logs/package.log
      - name: Install and activate packaged extension in a fresh profile
        env:
          PM_TEST_RESOURCE_SOAK_SECONDS: ${{ inputs.resource_soak_seconds }}
          PM_TEST_RESOURCE_SOAK_REPORT: ${{ github.workspace }}/.tmp/release-logs/resource-soak.json
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a npm run test:packaged 2>&1 | tee .tmp/release-logs/activation.log
          else
            npm run test:packaged 2>&1 | tee .tmp/release-logs/activation.log
          fi
      - name: Upload verified VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portmanager-${{ matrix.target }}
          path: portmanager-${{ matrix.target }}-*.vsix
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-${{ matrix.target }}
          path: .tmp/release-logs/
          if-no-files-found: warn
          retention-days: 30
  windows-fallback:
    name: Windows Node fallback
    if: inputs.resource_soak_seconds != '0' && (!inputs.validation_target || inputs.validation_target == 'all' || inputs.validation_target == 'windows-fallback')
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Verify Node fallback lifecycle and shared resource limits
        run: node --test --test-concurrency=1 out/test/unit/proxy-network-resources.test.js out/test/unit/host-port-proxy-lifecycle.test.js out/test/unit/browser-network-proxy-transport.test.js out/test/unit/logical-port-router.test.js out/test/unit/router-verdict-cache.test.js
      - name: Soak production Node proxy managers
        run: node out/test/integration/proxy-resource-soak.js
        env:
          PM_TEST_RESOURCE_SOAK_SECONDS: ${{ inputs.resource_soak_seconds }}
          PM_TEST_RESOURCE_SOAK_REPORT: ${{ github.workspace }}/.tmp/release-logs/resource-soak.json
      - name: Upload Windows fallback report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-windows-fallback
          path: .tmp/release-logs/
          if-no-files-found: warn
          retention-days: 30
